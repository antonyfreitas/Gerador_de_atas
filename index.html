    .tools { margin-top: 28px; }
    .tool { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 18px 0; color: inherit; font: inherit; }
    .tool b { display: block; font-size: 1.2rem; }
    .tool span { color: var(--mut); font-size: .95rem; }
    .tool.on { cursor: pointer; border-left: 4px solid var(--acc); padding-left: 14px; }
    .tool[disabled] { opacity: .55; }
    .back { background: none; border: 0; color: var(--acc); font: inherit; font-weight: 700; padding: 8px 0; min-height: 44px; cursor: pointer; }
    fieldset { border: 0; border-top: 2px solid var(--ink); margin: 30px 0 0; padding: 6px 0 0; min-width: 0; }
    legend { font-weight: 700; font-size: 1.15rem; padding: 0 10px 0 0; }
    .g { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 18px; margin-top: 10px; }
    .wide { grid-column: 1 / -1; }
    label { display: block; font-size: .85rem; color: var(--mut); }
    input[type=text], input[type=time], input[type=date], input[type=number], textarea { display: block; width: 100%; box-sizing: border-box; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; background: transparent; color: var(--ink); font: inherit; font-size: 1.05rem; padding: 6px 0; min-height: 44px; }
    textarea { min-height: 92px; resize: vertical; }
    .on { border-bottom-color: var(--acc) !important; }
    .ck { display: flex; gap: 10px; align-items: center; font-size: 1rem; color: var(--ink); min-height: 44px; }
    .ck input { width: 22px; height: 22px; accent-color: var(--acc); }
    :focus-visible { outline: 3px solid var(--acc); outline-offset: 3px; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }

    #sug { position: absolute; z-index: 20; margin: 0; padding: 4px 0; list-style: none; background: var(--paper); border: 1px solid var(--ink); border-radius: 10px; max-height: 264px; overflow: auto; }

const nz=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[-\s]+/g,' ').trim();
const HYMNS=HRAW.split('\n').filter(Boolean).map(l=>{const i=l.indexOf('|'),n=l.slice(0,i),t=l.slice(i+1);return{n,t,k:nz(n+' '+t)}});

const PAO='Ó Deus, Pai Eterno, nós te rogamos em nome de teu Filho, Jesus Cristo, que abençoes e santifiques este pão para as almas de todos os que partilharem dele, para que o comam em lembrança do corpo de teu Filho e testifiquem a ti, ó Deus, Pai Eterno, que desejam tomar sobre si o nome de teu Filho e recordá-lo sempre e guardar os mandamentos que ele lhes deu, para que possam ter sempre consigo o seu Espírito. Amém.';
const AGUA='Ó Deus, Pai Eterno, nós te rogamos em nome de teu Filho, Jesus Cristo, que abençoes e santifiques esta água, para as almas de todos os que beberem dela, para que o façam em lembrança do sangue de teu Filho, que por eles foi derramado, e testifiquem a ti, ó Deus, Pai Eterno, que sempre se lembram dele, para que possam ter consigo o seu Espírito. Amém.';
const NOTA='Apoio e desobrigações / Apresentação dos apoiados no S. Aarônico / Reconhecimento de membros e recém-conversos na ala / Abençoar e dar nome a crianças / Confirmação de novos conversos';

const fd=s=>s?s.split('-').reverse().join('/'):'';
const lines=s=>(s||'').split('\n').map(t=>t.trim()).filter(Boolean);
const p2=n=>String(n).padStart(2,'0');
function nextSunday(){const t=new Date();t.setDate(t.getDate()+(7-t.getDay())%7);return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())}

function buildPdf(d,s){
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const M=12,CW=186,PH=297,LH=4.6*s,P=2*s,MH=8*s,GAP=2.6*s,BH=5.6*s,F=10*s,INK=[18,49,43];
  let y=M,over=false;
  doc.setDrawColor(130,145,138);doc.setLineWidth(.25);
  const need=h=>{if(y+h>PH-M)over=true};
  const txt=(t,x,yy,st='normal',sz=F,col=INK)=>{doc.setFont('helvetica',st);doc.setFontSize(sz);doc.setTextColor(col[0],col[1],col[2]);doc.text(t,x,yy)};
  const bar=n=>{need(BH);doc.setFillColor(INK[0],INK[1],INK[2]);doc.rect(M,y,CW,BH,'F');txt(n.toUpperCase(),M+P,y+BH*.72,'bold',F*.95,[255,255,255]);y+=BH};
  const cells=a=>{
    const m=a.map(([l,v,w])=>{
      doc.setFont('helvetica','bold');doc.setFontSize(F);
      const lw=doc.getTextWidth(l+':')+1.5*s,st=lw>w*.55;
      doc.setFont('helvetica','normal');
      return{l,w,lw,st,t:v?doc.splitTextToSize(v,st?w-2*P:w-2*P-lw):[]};
    });
    const h=Math.max(MH,...m.map(c=>2*P+(c.st?LH:0)+Math.max(1,c.t.length)*LH-s));
    need(h);let x=M;
    m.forEach(c=>{
      doc.rect(x,y,c.w,h);const b=y+P+F*.31;
      txt(c.l+':',x+P,b,'bold');
      const x0=c.st?x+P:x+P+c.lw,b0=c.st?b+LH:b;
      if(c.t.length)c.t.forEach((q,i)=>txt(q,x0,b0+i*LH));
      else doc.line(x0,b0+.9*s,x+c.w-P,b0+.9*s);
      x+=c.w;
    });
    y+=h;
  };
  const list=(label,note,items)=>{
    doc.setFont('helvetica','normal');doc.setFontSize(F);
    const L=[];items.forEach(t=>doc.splitTextToSize(t,CW-2*P-5*s).forEach((q,i)=>L.push([i?'':'-',q])));
    const NL=LH*.9,nl=note?doc.splitTextToSize(note,CW-2*P):[];
    const h=2*P+(label?LH:0)+nl.length*NL+Math.max(L.length,2)*LH;
    need(h);doc.rect(M,y,CW,h);let yy=y+P+F*.31;
    if(label){txt(label+':',M+P,yy,'bold');yy+=LH}
    nl.forEach(q=>{txt(q,M+P,yy,'italic',F*.85,[90,105,98]);yy+=NL});
    if(L.length)L.forEach(([b,q])=>{txt(b,M+P,yy);txt(q,M+P+5*s,yy);yy+=LH});
    else for(let i=0;i<2;i++){doc.line(M+P,yy+.9*s,M+CW-P,yy+.9*s);yy+=LH}
    y+=h;
  };
  const prayer=(label,text)=>{
    doc.setFont('helvetica','normal');doc.setFontSize(F*.9);
    const t=doc.splitTextToSize(text,CW-2*P),PL=LH*.9,h=2*P+LH+t.length*PL;
    need(h);doc.rect(M,y,CW,h);
    txt(label+':',M+P,y+P+F*.31,'bold');
    t.forEach((q,i)=>txt(q,M+P,y+P+F*.31+LH+i*PL,'normal',F*.9));
    y+=h;
  };

  const T=17*s,tb=y+T*.3;
  txt('Ata - Ala '+(d.ala||'')+(d.data?' - '+fd(d.data):''),M,tb,'bold',T);
  doc.setFont('helvetica','bold');doc.setFontSize(F);
  const rx=M+CW,fw=26*s,fl='Freq.:',flw=doc.getTextWidth(fl)+1.5;
  txt(fl,rx-fw-flw,tb,'bold');
  if(d.freq)txt(d.freq,rx-fw+1,tb);else doc.line(rx-fw,tb+.9,rx,tb+.9);
  y+=T*.3+3.4*s;

  bar('Informações');
  cells([['Presidida',d.presidida,CW/2],['Dirigida',d.dirigida,CW/2]]);
  cells([['Regente',d.regente,CW/2],['Pianista',d.pianista,CW/2]]);
  y+=GAP;bar('Abertura');
  cells([['Boas-vindas / Reconhecimentos de autoridades e líderes',d.boasvindas,CW]]);
  list('Anúncios','',lines(d.anuncios));
  cells([['Hino de abertura',d.hinoAbertura,CW/2],['Oração de abertura',d.oracaoAbertura,CW/2]]);
  y+=GAP;bar('Assuntos da ala e da estaca');
  list('',NOTA,lines(d.assuntos));
  y+=GAP;bar('Sacramento');
  cells([['Hino sacramental',d.hinoSacramental,CW]]);
  if(d.incluirOr){prayer('Benção do Pão',PAO);prayer('Benção da Água',AGUA)}
  y+=GAP;bar('Mensagens do evangelho');
  cells([['Primeiro orador',d.orador1,CW]]);
  cells([['Segundo orador',d.orador2,CW]]);
  cells([['Hino intermediário',d.hinoInter,CW]]);
  cells([['Último orador',d.orador3,CW]]);
  y+=GAP;bar('Encerramento');
  cells([['Último hino',d.ultimoHino,CW/2],['Última oração',d.ultimaOracao,CW/2]]);
  return{doc,over,s};
}

const db = {
  get: () => {
    try {
      const data = localStorage.getItem('atas_ala');
      return data ? JSON.parse(data) : [];
    } catch(e) { return []; }
  },
  save: (ata) => {
    try {
      let atas = db.get();
      if (ata.id) {
        atas = atas.map(a => a.id === ata.id ? ata : a);
      } else {
        ata.id = Date.now().toString();
        atas.push(ata);
      }
      atas.sort((a,b) => b.data.localeCompare(a.data));
      localStorage.setItem('atas_ala', JSON.stringify(atas));
      return ata;
    } catch(e) { console.error('Erro ao salvar', e); return null; }
  },
  delete: (id) => {
    try {
      let atas = db.get().filter(a => a.id !== id);
      localStorage.setItem('atas_ala', JSON.stringify(atas));
      return true;
    } catch(e) { return false; }
  }
};

const SECTIONS = [
  ['Informações', [['ala','Ala'],['data','Data','date'],['freq','Frequência','number'],['presidida','Presidida'],['dirigida','Dirigida'],['regente','Regente'],['pianista','Pianista']]],
  ['Abertura', [['boasvindas','Boas-vindas e reconhecimento de autoridades e líderes'],['anuncios','Anúncios','area','Um por linha'],['hinoAbertura','Hino de abertura','text','Número ou nome do hino', true],['oracaoAbertura','Oração de abertura']]],
  ['Assuntos da ala e da estaca', [['assuntos','Apoios, desobrigações e outros assuntos','area','Um por linha. Ex.: APOIAR: nome - chamado']]],
  ['Sacramento', [['hinoSacramental','Hino sacramental','text','Número ou nome do hino', true],['incluirOr','Incluir no PDF as orações do pão e da água','check']]],
  ['Mensagens do evangelho', [['orador1','Primeiro orador'],['orador2','Segundo orador'],['hinoInter','Hino intermediário','text','Número ou nome do hino', true],['orador3','Último orador']]],
  ['Encerramento', [['ultimoHino','Último hino','text','Número ou nome do hino', true],['ultimaOracao','Última oração']]]
];

const WIDE = ['boasvindas', 'recep', 'anuncios', 'assuntos'];

function Field({ id, label, type, placeholder, isHymn, value, onChange, onHymnInput, closeSug, onKeyDown }) {
  const isWide = WIDE.includes(id);
  
  if (type === 'check') {
    return (
      <label className="ck wide">
        <input type="checkbox" checked={value} onChange={e => onChange(id, e.target.checked)} />
        {label}
      </label>
    );
  }
  
  return (
    <div className={isWide ? 'wide' : ''}>
      <label htmlFor={id}>{label}</label>
      {type === 'area' ? (
        <textarea id={id} placeholder={placeholder} value={value} onChange={e => onChange(id, e.target.value)} className={value ? 'on' : ''} />
      ) : (
        <input
          id={id}
          type={type || 'text'}
          inputMode={type === 'number' ? 'numeric' : undefined}
          placeholder={placeholder}
          autoComplete="off"
          value={value}
          onChange={e => {
            onChange(id, e.target.value);
            if (isHymn) onHymnInput(id, e.target.value, e.target);
          }}
          onFocus={e => {
            if (isHymn) onHymnInput(id, e.target.value, e.target);
          }}
          onBlur={() => isHymn && setTimeout(closeSug, 150)}
          onKeyDown={e => isHymn && onKeyDown(e, id)}
          className={value ? 'on' : ''}
        />
      )}
    </div>
  );
}

function AtaEditor({ ata, onSave, onBack }) {
  const [data, setData] = React.useState(ata || { ala: 'Ipanema', data: nextSunday(), incluirOr: true });
  const [msg, setMsg] = React.useState({ text: '', err: false });
  const [sug, setSug] = React.useState({ show: false, list: [], top: 0, left: 0, width: 0, fieldId: null });

  const handleChange = (id, val) => {
    setData(prev => ({ ...prev, [id]: val }));
  };

  const onHymnInput = (id, val, el) => {
    if (!el) return;
    const q = nz(val);
    let r = !q ? [] : /^\d+$/.test(q) ? HYMNS.filter(h => h.n.startsWith(q)) : HYMNS.filter(h => h.k.includes(q));
    r = r.sort((a,b) => (b.n===q)-(a.n===q) || a.n-b.n).slice(0,8);
    
    if (r.length > 0) {
      const b = el.getBoundingClientRect();
      const hh = 264, up = b.bottom + hh + 100 > window.innerHeight && b.top > hh + 10;
      setSug({
        show: true, list: r, 
        top: up ? b.top + window.scrollY - hh - 4 : b.bottom + window.scrollY + 4,
        left: b.left + window.scrollX, width: b.width, fieldId: id
      });
    } else {
      setSug(prev => ({ ...prev, show: false }));
    }
  };

  const closeSug = () => setSug(prev => ({ ...prev, show: false }));

  const pickHymn = (n, fieldIdOverride = null) => {
    const targetId = fieldIdOverride || sug.fieldId;
    const h = HYMNS.find(x => x.n === n);
    if (h && targetId) {
      handleChange(targetId, h.n + ' - ' + h.t);
      closeSug();
    }
  };

  const handleKeyDown = (e, id) => {
    if (e.key === 'Escape') closeSug();
    if (e.key === 'Enter' && sug.show && sug.fieldId === id && sug.list.length > 0) {
      e.preventDefault();
      pickHymn(sug.list[0].n, id);
    }
  };

  const handleClear = () => {
    setData({ ala: 'Ipanema', data: nextSunday(), incluirOr: true });
    setMsg({ text: 'Formulário limpo.', err: false });
  };

  const handleSave = () => {
    const saved = db.save(data);
    if (saved) {
      setData(saved);
      setMsg({ text: 'Ata salva com sucesso!', err: false });
      setTimeout(() => setMsg({ text: '', err: false }), 3000);
    } else {
      setMsg({ text: 'Erro ao salvar ata.', err: true });
    }
  };

  const handleGen = async () => {
    if (!window.jspdf) {
      setMsg({ text: 'A biblioteca de PDF não carregou. Recarregue a página.', err: true });
      return;
    }
    
    handleSave();
    
    let r;
    try {
      let fitRes;
      for(let k=20; k>=10; k--){ fitRes = buildPdf(data, k/20); if(!fitRes.over) break; }
      r = fitRes;
    } catch(e) {
      setMsg({ text: 'Não foi possível gerar o PDF.', err: true });
      return;
    }
    
    const blob = r.doc.output('blob');
    const slug = (data.ala || 'ala').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const nome = 'ata-ala-'+slug+'-'+(data.data || 'sem-data')+'.pdf';
    const nota = r.over ? ' Atenção: parte pode ter ficado de fora.' : r.s < .8 ? ' Letras reduzidas.' : '';
    
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = nome;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setMsg({ text: 'PDF pronto: ' + nome + nota, err: false });
    } catch(e) {
      setMsg({ text: 'Não foi possível entregar o arquivo.', err: true });
    }
  };

  return (
    <React.Fragment>
      <main id="ata" style={{ paddingBottom: '180px' }}>
        <button className="back" onClick={onBack}>‹ Voltar</button>
        <h1>{data.id ? 'Editar Ata' : 'Nova Ata'}</h1>
        <p className="mut">Preencha o que já sabe. Campos vazios saem no PDF como linha em branco, para completar à mão.</p>
        
        <form onSubmit={e => e.preventDefault()}>
          {SECTIONS.map(([title, fields]) => (
            <fieldset key={title}>
              <legend>{title}</legend>
              <div className="g">
                {fields.map(([id, label, type, placeholder, isHymn]) => (
                  <Field key={id} id={id} label={label} type={type} placeholder={placeholder} isHymn={isHymn}
                         value={data[id] === undefined ? (type==='check'?false:'') : data[id]}
                         onChange={handleChange} 
                         onHymnInput={onHymnInput} 
                         closeSug={closeSug}
                         onKeyDown={handleKeyDown} />
                ))}
              </div>
            </fieldset>
          ))}
        </form>
      </main>

      <div className="bar">
        {msg.text && <div id="st" className={msg.err ? 'err' : 'succ'}>{msg.text}</div>}
        <div className="actions">
          <button className="btn" type="button" onClick={handleClear}>Limpar</button>
          <button className="btn sec" type="button" onClick={handleSave}>Salvar</button>
          <button className="btn p" type="button" onClick={handleGen}>Gerar PDF</button>
        </div>
      </div>

      {sug.show && (
        <ul id="sug" style={{ top: sug.top, left: sug.left, width: sug.width }}>
          {sug.list.map(h => (
            <li key={h.n} onPointerDown={e => { e.preventDefault(); pickHymn(h.n); }}>
              <b>{h.n}</b>{h.t}
            </li>
          ))}
        </ul>
      )}
    </React.Fragment>
  );
}

function History({ onNew, onEdit }) {
  const [atas, setAtas] = React.useState([]);

  React.useEffect(() => {
    setAtas(db.get());
  }, []);

  const handleDelete = (e, id) => {
    e.stopPropagation();
    if(confirm('Apagar esta ata?')) {
      db.delete(id);
      setAtas(db.get());
    }
  };

  return (
    <main>
      <h1>Histórico de Atas</h1>
      <p className="mut">Atas salvas na memória deste navegador. (Nenhum dado é enviado à internet).</p>
      
      <div style={{ marginTop: '20px' }}>
        <button className="btn p" style={{ width: '100%' }} onClick={onNew}>+ Nova Ata</button>
      </div>

      <div style={{ marginTop: '30px' }}>
        {atas.length === 0 ? (
          <div className="empty-state">Nenhuma ata salva ainda.</div>
        ) : (
          atas.map(ata => (
            <div key={ata.id} className="list-item" onClick={() => onEdit(ata)}>
              <div>
                <b>{fd(ata.data)} - {ata.ala}</b>
                <span>{ata.presidida ? `Pres: ${ata.presidida}` : 'Sem presidente'}</span>
              </div>
              <button className="btn" style={{ minHeight: '32px', padding: '0 10px', fontSize: '0.85rem' }} 
                      onClick={(e) => handleDelete(e, ata.id)}>Excluir</button>
            </div>
          ))
        )}
      </div>
    </main>
  );
}

function App() {
  const [view, setView] = React.useState('home');
  const [currentAta, setCurrentAta] = React.useState(null);

  const toggleTheme = () => {
    const root = document.documentElement;
    const t = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = t;
    localStorage.setItem('tema', t);
  };

  return (
    <React.Fragment>
      <header className="hd">
        <span onClick={() => setView('home')} style={{cursor: 'pointer'}}>Ala Ipanema</span>
        <button className="back" type="button" onClick={toggleTheme}>Tema claro/escuro</button>
      </header>

      {view === 'home' && (
        <main>
          <h1>Secretaria</h1>
          <p className="mut">Ferramentas para o dia a dia da secretaria.</p>
          <div className="tools">
            <button className="tool on" onClick={() => setView('history')}>
              <b>Atas da Reunião Sacramental</b>
              <span>Crie, edite e gere PDFs de reuniões. Seus dados ficam salvos apenas neste aparelho.</span>
            </button>
            <button className="tool" disabled><b>Atualizações do Manual</b><span>Em breve</span></button>
            <button className="tool" disabled><b>Transmissão</b><span>Em breve</span></button>
            <button className="tool" disabled><b>Frequência (Em nuvem)</b><span>Requer autorização (Trilha B)</span></button>
          </div>
        </main>
      )}

      {view === 'history' && (
        <History 
          onNew={() => { setCurrentAta(null); setView('editor'); }}
          onEdit={(ata) => { setCurrentAta(ata); setView('editor'); }}
        />
      )}

      {view === 'editor' && (
        <AtaEditor 
          ata={currentAta} 
          onBack={() => { setView('history'); setCurrentAta(null); }} 
        />
      )}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
